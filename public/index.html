        function fmtDate(iso){try{return new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}
        function fmtShort(iso){try{return new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}
        function getMatchTime(m){if(m.createdAt)return m.createdAt;try{const p=m.id.substring(0,8);const ts=parseInt(p,36);if(ts>1000000000000&&ts<9999999999999)return new Date(ts).toISOString();}catch(e){}return null;}
        function getTeamColor(team){return team&&team.color?team.color:'#1e2a1e';}
        function renderPlayerChips(players){if(!players||!players.length)return '';return players.map(p=>`<span class="player-chip">👤 ${escapeHtml(p)}</span>`).join('');}
        function sortRoster(players){return [...players].sort((a,b)=>{const aT=a.addedAt||'',bT=b.addedAt||'';if(!aT&&!bT)return 0;if(!aT)return 1;if(!bT)return -1;return aT<bT?-1:1;});}
        function getRosterSplit(){const sorted=sortRoster(appData.players||[]);const main=[],reserve=[];sorted.forEach(p=>{const st=p.status||'confirmed';if(st==='reserve')reserve.push(p);else if(main.length<ROSTER_LIMIT)main.push(p);else reserve.push(p);});return {main,reserve,sorted};}
        function getRosterBadge(name){const {main,reserve}=getRosterSplit();const inMain=main.find(p=>p.name===name);if(inMain)return inMain.status==='pending'?{icon:'🟡',color:'#f5a623',label:'🟡 Под вопросом'}:{icon:'🟢',color:'#2e9e44',label:'🟢 В основе'};const inRes=reserve.find(p=>p.name===name);if(inRes)return {icon:'🔴',color:'#e74c3c',label:'🔴 Резерв'};return null;}
        // ... (остальные утилиты без изменений) ...

        // === ИЗМЕНЕНИЕ: функция для обновления выпадающего списка турниров в мобильной шапке ===
        function updateTournamentSelectMobile() {
            const sel = document.getElementById('tournamentSelectMobile');
            if (!sel) return;
            sel.innerHTML = '';

                return;

            tournamentsList.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = t.name;
                opt.selected = (t.id === currentTournamentId);
                sel.appendChild(opt);
            });
        }

        function isAdmin(n){return getAdmins().includes(n);}
        function isCurrentUserAdmin(){return isAdmin(getCurrentUser());}
        function getCurrentUser(){return localStorage.getItem(CURRENT_USER_KEY)||'';}

        // ================= РЕНДЕР ГЛАВНЫЙ =================
        function render(){
            const panel = document.getElementById('contentPanel');
            renderBreadcrumbs(); renderGuestBanner(); renderNoTournamentBanner(); renderNavTabs(); renderMobileUI();
            if(!currentTournamentId && currentTab!=='players' && currentTab!=='combinedHistory' && currentTab!=='overall' && currentTab!=='records' && currentTab!=='chat' && currentTab!=='admin' && currentTab!=='dm'){
                panel.innerHTML = `<div class="empty-state"><span class="emoji">🏆</span><p>Нет активных турниров.</p></div>`;
                updateChatBadge(); return;
            }
            switch(currentTab){
                case 'home': panel.innerHTML = renderHomeTab(); break;
                case 'settings': panel.innerHTML = renderSettingsTab(); break;
                case 'combinedHistory': panel.innerHTML = renderCombinedHistoryTab(); break;
                case 'players': panel.innerHTML = renderPlayersTab(); break;
                case 'stats': panel.innerHTML = renderStatsTab(); break;
                case 'overall': panel.innerHTML = renderOverallTab(); break;

                case 'admin': panel.innerHTML = renderAdminTab(); break;
                case 'dm': panel.innerHTML = renderDMTab(); break;
                default: panel.innerHTML = renderHomeTab();
            }
            updateChatBadge();
            document.querySelectorAll('.mobile-nav-item').forEach(b => b.classList.toggle('active', b.dataset.mnav === currentTab));
            const fab = document.getElementById('fabBtn'); if(fab) fab.style.display = (currentTournamentId ? 'flex' : 'none');
            // === ИЗМЕНЕНИЕ: обработчик клика по пин-баннеру ===

            if (pinnedBanner) {
                pinnedBanner.onclick = () => {
                    currentTab = 'chat';
